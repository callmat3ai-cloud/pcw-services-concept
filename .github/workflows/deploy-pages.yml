name: Deploy PCW concept preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site only
        run: |
          mkdir -p _publish
          cp -r index.html robots.txt .nojekyll _publish/
          for d in about our-work testimonials knowledge-hub project-services property-services services assets; do
            [ -d "$d" ] && cp -r "$d" _publish/
          done
          rm -rf _publish/assets/css/concept.css _publish/assets/css/main.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
